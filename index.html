<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Habitud - Inicio de sesión</title>
    <link rel="stylesheet" href="css/estiloHabitud.css">
</head>

<body>
<main>
    <h1>HABITUD</h1>

    <p>Organiza tus hábitos y mejora tu día.</p>

    <form action="pantallas/panel.html">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit">Iniciar sesión</button>
    </form>

    <p><a href="pantallas/recuperar.html">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tienes una cuenta? <a href="pantallas/registro.html">Regístrate aquí</a></p>
</main>
</body>
</html>
